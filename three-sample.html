<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Dark Floating Geometry</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            font-family: 'Courier New', monospace;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            z-index: 100;
            text-shadow: 0 0 10px #00ffff;
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>Three.js 3D Sample</h2>
        <p>Floating geometric shapes with neon effects</p>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);
        
        // Create floating geometries
        const geometries = [];
        const materials = [
            new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true }),
            new THREE.MeshBasicMaterial({ color: 0xff0080, wireframe: true }),
            new THREE.MeshBasicMaterial({ color: 0x80ff00, wireframe: true })
        ];
        
        // Add different shapes
        for (let i = 0; i < 15; i++) {
            let geometry;
            
            if (i % 3 === 0) {
                geometry = new THREE.IcosahedronGeometry(Math.random() * 2 + 0.5);
            } else if (i % 3 === 1) {
                geometry = new THREE.OctahedronGeometry(Math.random() * 2 + 0.5);
            } else {
                geometry = new THREE.TetrahedronGeometry(Math.random() * 2 + 0.5);
            }
            
            const material = materials[i % 3];
            const mesh = new THREE.Mesh(geometry, material);
            
            // Random positioning
            mesh.position.x = (Math.random() - 0.5) * 20;
            mesh.position.y = (Math.random() - 0.5) * 20;
            mesh.position.z = (Math.random() - 0.5) * 20;
            
            // Store animation properties
            mesh.userData = {
                rotationSpeed: {
                    x: (Math.random() - 0.5) * 0.02,
                    y: (Math.random() - 0.5) * 0.02,
                    z: (Math.random() - 0.5) * 0.02
                },
                floatSpeed: Math.random() * 0.01 + 0.005,
                floatOffset: Math.random() * Math.PI * 2
            };
            
            scene.add(mesh);
            geometries.push(mesh);
        }
        
        // Add particles
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = 500;
        const positions = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 50;
        }
        
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMaterial = new THREE.PointsMaterial({
            color: 0x888888,
            size: 0.1
        });
        
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);
        
        camera.position.z = 15;
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate and float geometries
            geometries.forEach((mesh, index) => {
                mesh.rotation.x += mesh.userData.rotationSpeed.x;
                mesh.rotation.y += mesh.userData.rotationSpeed.y;
                mesh.rotation.z += mesh.userData.rotationSpeed.z;
                
                // Floating motion
                const time = Date.now() * mesh.userData.floatSpeed;
                mesh.position.y += Math.sin(time + mesh.userData.floatOffset) * 0.01;
            });
            
            // Rotate particles slowly
            particles.rotation.y += 0.001;
            
            // Camera orbit
            const time = Date.now() * 0.0005;
            camera.position.x = Math.cos(time) * 15;
            camera.position.z = Math.sin(time) * 15;
            camera.lookAt(scene.position);
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
