<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS/JS 2D Dark Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(45deg, #0d1117, #161b22, #21262d);
            font-family: 'Consolas', 'Monaco', monospace;
            overflow: hidden;
            height: 100vh;
        }
        
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .main-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #58a6ff;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 20px #58a6ff, 0 0 40px #58a6ff;
            animation: glow 2s ease-in-out infinite alternate;
            z-index: 10;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 20px #58a6ff, 0 0 40px #58a6ff; }
            to { text-shadow: 0 0 30px #58a6ff, 0 0 60px #58a6ff, 0 0 80px #58a6ff; }
        }
        
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .floating-box {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid;
            border-radius: 8px;
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-box:nth-child(1) {
            border-color: #ff7b72;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
            box-shadow: 0 0 20px #ff7b72;
        }
        
        .floating-box:nth-child(2) {
            border-color: #a5f3fc;
            top: 70%;
            left: 80%;
            animation-delay: 2s;
            box-shadow: 0 0 20px #a5f3fc;
        }
        
        .floating-box:nth-child(3) {
            border-color: #7ee787;
            top: 60%;
            left: 20%;
            animation-delay: 4s;
            box-shadow: 0 0 20px #7ee787;
        }
        
        .floating-box:nth-child(4) {
            border-color: #ffa657;
            top: 30%;
            left: 70%;
            animation-delay: 1s;
            box-shadow: 0 0 20px #ffa657;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(90deg); }
            50% { transform: translateY(-40px) rotate(180deg); }
            75% { transform: translateY(-20px) rotate(270deg); }
        }
        
        .pulse-circle {
            position: absolute;
            border-radius: 50%;
            border: 3px solid #bd93f9;
            animation: pulse 3s linear infinite;
        }
        
        .pulse-circle:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 40%;
            left: 15%;
            animation-delay: 0s;
        }
        
        .pulse-circle:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 20%;
            left: 60%;
            animation-delay: 1s;
        }
        
        .pulse-circle:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 75%;
            left: 50%;
            animation-delay: 2s;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: I;
                box-shadow: 0 0 0 0 rgba(189, 147, 249, 0.7);
            }
            50% {
                opacity: 0.6;
                box-shadow: 0 0 0 20px rgba(189, 147, 249, 0.3);
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
                box-shadow: 0 0 0 40px rgba(189, 147, 249, 0);
            }
        }
        
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #58a6ff;
            border-radius: 50%;
            animation: drift 10s linear infinite;
            opacity: 0.6;
        }
        
        @keyframes drift {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }
        
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(90deg, transparent, #58a6ff, transparent);
            opacity: 0.3;
            animation: wave 4s ease-in-out infinite;
        }
        
        @keyframes wave {
            0%, 100% { transform: skewX(0deg); }
            50% { transform: skewX(10deg); }
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #8b949e;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .info-panel h3 {
            color: #58a6ff;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-panel">
            <h3>CSS/JS 2D Animation Sample</h3>
            <p>• Glowing text effects</p>
            <p>• Floating geometric shapes</p>
            <p>• Pulsing circles</p>
            <p>• Particle system</p>
        </div>
        
        <h1 class="main-title">Dark Motion</h1>
        
        <div class="floating-elements">
            <div class="floating-box"></div>
            <div class="floating-box"></div>
            <div class="floating-box"></div>
            <div class="floating-box"></div>
            
            <div class="pulse-circle"></div>
            <div class="pulse-circle"></div>
            <div class="pulse-circle"></div>
        </div>
        
        <div class="particles" id="particles"></div>
        <div class="wave"></div>
    </div>
    
    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random positioning and timing
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
                
                // Random colors
                const colors = ['#58a6ff', '#ff7b72', '#a5f3fc', '#7ee787', '#ffa657', '#bd93f9'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Mouse interaction
        document.addEventListener('mousemove', (e) => {
            const cursor = e.clientX / window.innerWidth;
            const cursorY = e.clientY / window.innerHeight;
            
            // Move floating boxes slightly based on mouse position
            const boxes = document.querySelectorAll('.floating-box');
            boxes.forEach((box, index) => {
                const speed = (index + 1) * 0.5;
                box.style.transform = `translate(${cursor * speed}px, ${cursorY * speed}px)`;
            });
        });
        
        // Initialize
        createParticles();
        
        // Add click effects
        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.style.position = 'absolute';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '0px';
            ripple.style.height = '0px';
            ripple.style.border = '2px solid #58a6ff';
            ripple.style.borderRadius = '50%';
            ripple.style.pointerEvents = 'none';
            ripple.style.animation = 'ripple 1s ease-out forwards';
            
            document.body.appendChild(ripple);
            
            setTimeout(() => {
                document.body.removeChild(ripple);
            }, 1000);
        });
        
        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    width: 200px;
                    height: 200px;
                    margin-left: -100px;
                    margin-top: -100px;
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
